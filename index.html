        <h2>Frequently Asked Questions</h2>

        <h3>What time is it in Tokyo right now?</h3>
        <p>Tokyo is in Japan Standard Time (JST, UTC+9). Japan does not observe daylight saving time. Visit ZoneMap to see the exact current time in Tokyo alongside any other city.</p>

        <h3>What time is it in London right now?</h3>
        <p>London observes GMT (UTC+0) in winter and BST (UTC+1) in summer. ZoneMap shows the current London time with automatic DST switching.</p>

        <h3>How do I convert New York time to London time?</h3>
        <p>New York is typically 5 hours behind London (EST vs GMT) or 4 hours behind during summer (EDT vs BST). Add both cities to ZoneMap and drag the timeline to any time to see the conversion instantly.</p>

        <h3>What is the time difference between Los Angeles and New York?</h3>
        <p>Los Angeles (Pacific Time) is 3 hours behind New York (Eastern Time) year-round. ZoneMap shows both clocks simultaneously so you can compare at any time.</p>

        <h3>How do I find the best meeting time for a team in San Francisco, London, and Singapore?</h3>
        <p>Add San Francisco, London, and Singapore to ZoneMap. The working hours overlap bar highlights any windows where all three cities are within standard business hours. Typical overlap for SF-London-Singapore is very limited due to the 16-hour spread, but ZoneMap makes it easy to find the least inconvenient time.</p>

        <h3>What is UTC and how do I convert UTC to local time?</h3>
        <p>UTC (Coordinated Universal Time) is the world's time standard at zero offset. To convert UTC to your local time, add or subtract your timezone offset. ZoneMap displays UTC offsets for every city and handles DST automatically.</p>

        <h3>What is the IANA timezone database?</h3>
        <p>The IANA timezone database (also called the Olson database or tz database) is the authoritative list of all world timezones, including historical DST rules. ZoneMap uses IANA timezone identifiers like "America/New_York", "Asia/Tokyo", and "Europe/London" for accurate time calculations.</p>
